[project]
name = "telco-churn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mahen", email = "mahen.ath@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.6.0",
    "mlflow>=3,<4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
telco-churn = "telco_churn:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]